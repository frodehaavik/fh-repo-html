<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243a">
<title>Mine saker</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17283b;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:20px 16px 48px}.hero{background:linear-gradient(135deg,#10243a,#234e70);border-radius:22px;padding:27px 23px;color:white;box-shadow:0 10px 26px #152a4220}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#c1d7e7;font-weight:700}.hero h1{font-size:30px;margin:8px 0 5px;letter-spacing:-.035em}.hero p{color:#d4e2ed;font-size:14px;margin:0;line-height:1.5}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 3px 12px}.toolbar h2{font-size:17px;margin:0}.count{font-size:12px;background:#e2eaf2;color:#36516b;padding:6px 10px;border-radius:999px;font-weight:700}.list{display:grid;gap:12px}.case{display:block;background:white;color:inherit;text-decoration:none;border:1px solid #e1e8f0;border-radius:17px;padding:18px;box-shadow:0 3px 12px #1a36520a;transition:transform .15s,box-shadow .15s}.case:focus-visible{outline:3px solid #4d92cc;outline-offset:3px}.case:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1a365218}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.number{font-size:12px;font-weight:800;letter-spacing:.035em;color:#25618e}.arrow{font-size:20px;color:#7890a5}.case h3{font-size:18px;letter-spacing:-.02em;margin:8px 0 5px}.desc{font-size:13px;line-height:1.5;color:#63758a;margin:0 0 15px}.owner{display:inline-flex;gap:7px;align-items:center;background:#edf4fa;color:#305c7c;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:650}.owner::before{content:'▦';font-size:14px}.footer{font-size:12px;color:#7b8b9d;text-align:center;margin-top:25px;line-height:1.6}.empty{background:white;padding:24px;border-radius:16px;color:#607287}@media(max-width:380px){.wrap{padding:13px 12px 35px}.hero{padding:23px 19px}.case{padding:15px}}
</style>
</head>
<body>
<main class="wrap"><header class="hero"><div class="eyebrow">Saksoversikt</div><h1>Mine saker</h1><p>Saker jeg følger hos departementer og kommuner.<br>Trykk på en sak for å åpne den.</p></header><div class="toolbar"><h2>Registrerte saker</h2><span class="count" id="antall"></span></div><section class="list" id="saksliste" aria-label="Saksliste"></section><p class="footer">Saksoversikten er manuelt vedlikeholdt. Klikk på en sak for å se informasjon hos ansvarlig virksomhet.</p></main>
<script>
// REDIGER BARE DENNE FUNKSJONEN FOR Å LEGGE TIL SAKER.
// Format: leggTilSak(saksnummer, hjelpetekst, virksomhet, lenke, beskrivelse);
function hentSaker() {
  leggTilSak(
    "22/868",
    "Kommunegrensejustering",
    "Kommunal- og distriktsdepartementet (KDD)",
    "https://einnsyn.no/saksmappe?id=http%3A%2F%2Fdata.einnsyn.no%2Fnoark4%2FSaksmappe--972417858--868--2022",
    "Forsand – fra Sandnes til Strand kommune"
  );

  // EKSEMPEL – fjern // foran linjene og endre verdiene:
  // leggTilSak("24/1234", "Veiprosjekt", "Sandnes kommune", "https://www.sandnes.kommune.no/", "Kort beskrivelse av saken");
}

// Resten trenger du ikke endre.
const saker = [];
function leggTilSak(nummer, tittel, virksomhet, lenke, beskrivelse = "") {
  saker.push({ nummer, tittel, virksomhet, lenke, beskrivelse });
}
function element(tag, className, value) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (value != null) el.textContent = value;
  return el;
}
function visSaker() {
  const liste = document.getElementById("saksliste");
  document.getElementById("antall").textContent = saker.length + (saker.length === 1 ? " sak" : " saker");
  if (!saker.length) { liste.append(element("div", "empty", "Ingen saker er lagt inn ennå.")); return; }
  for (const sak of saker) {
    const kort = element("a", "case");
    // Tillat bare vanlige nettlenker.
    try {
      const url = new URL(sak.lenke);
      if (url.protocol === "https:" || url.protocol === "http:") kort.href = url.href;
    } catch (_) {}
    if (!kort.href) { kort.removeAttribute("href"); }
    else { kort.target = "_blank"; kort.rel = "noopener noreferrer"; }
    const topp = element("div", "top");
    topp.append(element("span", "number", sak.nummer), element("span", "arrow", "↗"));
    kort.append(topp, element("h3", "", sak.tittel));
    if (sak.beskrivelse) kort.append(element("p", "desc", sak.beskrivelse));
    kort.append(element("span", "owner", sak.virksomhet));
    liste.append(kort);
  }
}
hentSaker(); visSaker();
</script>
</body></html>
