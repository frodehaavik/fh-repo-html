<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16324a"><title>Mine saker – Grensejustering</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183047;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:12px}.head{background:#16324a;color:white;border-radius:12px;padding:13px 16px;margin-bottom:14px}.head h1{font-size:20px;line-height:1.2;margin:0 0 3px;font-weight:750}.head p{font-size:12px;line-height:1.3;color:#d4e4ef;margin:0}.list{display:grid;gap:10px}.sak{display:block;background:#fff;border:1px solid #e0e7ed;border-radius:12px;padding:14px 15px;color:inherit;text-decoration:none;box-shadow:0 2px 8px #16324a0a}.sak:active{transform:scale(.995)}.sak:focus-visible{outline:3px solid #4b95cf}.top{display:flex;align-items:center;justify-content:space-between}.nr{color:#14639a;font-size:13px;font-weight:750}.arrow{font-size:19px;color:#8294a3}.title{font-size:16px;font-weight:720;margin:5px 0 3px}.desc{font-size:13px;color:#576a78;line-height:1.45}.org{display:inline-block;background:#edf3f7;color:#38536a;border-radius:6px;padding:5px 8px;margin-top:11px;font-size:11px;font-weight:650}.foot{font-size:11px;color:#718392;margin:15px 3px}
</style></head><body><main class="wrap"><header class="head"><h1>Mine saker</h1><p>Grensejustering Forsand – Sandnes til Strand</p></header><section id="liste" class="list" aria-label="Saksoversikt"></section><p class="foot">Trykk på en sak for å åpne lenken. Lenker til eksterne kilder.</p></main><script>
// Rediger bare denne funksjonen for å legge til eller endre saker.
function hentSaker(){
  return [
    { nummer:"22/868", tekst:"Kommunegrensejustering", instans:"Kommunal- og distriktsdepartementet (KDD)", beskrivelse:"Forsand – fra Sandnes til Strand kommune", lenke:"https://einnsyn.no/saksmappe?id=http%3A%2F%2Fdata.einnsyn.no%2Fnoark4%2FSaksmappe--972417858--868--2022" },
    { nummer:"22/20628", tekst:"Ny vurdering av grensejustering", instans:"Sandnes kommune", beskrivelse:"Kommunal behandling av Forsand-saken", lenke:"https://sandnes.samfunnsdata.com/folkets-votering/210728" }
  ];
}
const liste=document.getElementById('liste');
for(const sak of hentSaker()){
  const a=document.createElement('a');a.className='sak';a.href=sak.lenke;a.target='_blank';a.rel='noopener noreferrer';
  const top=document.createElement('div');top.className='top';const nr=document.createElement('span');nr.className='nr';nr.textContent=sak.nummer;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';top.append(nr,arrow);
  const title=document.createElement('div');title.className='title';title.textContent=sak.tekst;
  const desc=document.createElement('div');desc.className='desc';desc.textContent=sak.beskrivelse;
  const org=document.createElement('span');org.className='org';org.textContent=sak.instans;
  a.append(top,title,desc,org);liste.append(a);
}
</script></body></html>
