<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10253c">
<title>Mine saker</title>
<style>
:root{color-scheme:light;--navy:#10253c;--blue:#1d5d99;--muted:#66758a;--bg:#f3f6fa;--line:#e4eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}header{background:var(--navy);color:white;padding:calc(28px + env(safe-area-inset-top)) 20px 28px}header .inner,main{max-width:680px;margin:auto}h1{font-size:1.7rem;letter-spacing:-.04em;margin:0 0 6px}header p{margin:0;color:#c7d6e6;font-size:.94rem}main{padding:22px 16px 48px}.count{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 0 12px}.list{display:grid;gap:12px}.case{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px 16px;text-decoration:none;color:inherit;box-shadow:0 3px 14px #10253c08;min-height:100px;transition:transform .15s,box-shadow .15s}.case:hover{transform:translateY(-2px);box-shadow:0 8px 20px #10253c12}.case:focus-visible{outline:3px solid #2b78c6;outline-offset:3px}.details{flex:1;min-width:0}.number{font-size:.83rem;font-weight:800;color:var(--blue);letter-spacing:.02em;margin-bottom:7px}.title{font-size:1.04rem;font-weight:750;line-height:1.35;overflow-wrap:anywhere}.desc{color:var(--muted);font-size:.88rem;line-height:1.45;margin-top:5px;overflow-wrap:anywhere}.arrow{font-size:1.5rem;color:#71859a;flex:none}.empty{background:white;border-radius:14px;padding:24px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:24px}@media(prefers-reduced-motion:reduce){.case{transition:none}}
</style>
</head>
<body>
<header><div class="inner"><h1>Mine saker</h1><p>Trykk på en sak for å åpne den i offentlig saksinnsyn.</p></div></header>
<main><p id="count" class="count"></p><div id="list" class="list"></div><footer>Lenkene åpnes i en ny fane. Ingen API eller innlogging kreves.</footer></main>
<script>
// ============================================================
// LEGG INN SAKENE DINE HER.
// Én linje per sak: leggTilSak("saksnummer", "hjelpetekst", "lenke", "valgfri beskrivelse");
// Kopier en linje for å legge til flere saker.
// ============================================================
function hentSaker() {
  const saker = [];
  function leggTilSak(nummer, hjelpetekst, lenke, beskrivelse = "") {
    saker.push({ nummer, hjelpetekst, lenke, beskrivelse });
  }

  leggTilSak(
    "22/868",
    "Kommunegrensejustering - Kommunal- og distriktsdepartementet",
    "https://einnsyn.no/saksmappe?id=http%3A%2F%2Fdata.einnsyn.no%2Fnoark4%2FSaksmappe--972417858--868--2022",
    "Forsand – fra Sandnes til Strand kommune"
  );

  // Eksempel på ny sak (fjern // og fyll inn dine egne opplysninger):
  // leggTilSak("23/1234", "Min neste sak", "https://eksempel.no/sak", "Kort beskrivelse");

  return saker;
}

// Automatisk mobilvisning – denne delen trenger du ikke redigere.
function visSaker() {
  const saker = hentSaker();
  const liste = document.getElementById("list");
  document.getElementById("count").textContent = `${saker.length} ${saker.length === 1 ? "sak" : "saker"}`;
  for (const sak of saker) {
    const a = document.createElement("a");
    a.className = "case";
    a.href = sak.lenke;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const info = document.createElement("div");
    info.className = "details";
    const number = document.createElement("div");
    number.className = "number";
    number.textContent = sak.nummer;
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = sak.hjelpetekst;
    info.append(number, title);
    if (sak.beskrivelse) {
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = sak.beskrivelse;
      info.append(desc);
    }
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";
    arrow.setAttribute("aria-hidden", "true");
    a.append(info, arrow);
    liste.append(a);
  }
  if (!saker.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Ingen saker er lagt inn ennå.";
    liste.append(empty);
  }
}
visSaker();
</script>
</body>
</html>
