
<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4f7">
  <title>Blandingskalkulator</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #203249;
      background: #f2f4f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(100% - 36px, 540px);
      margin: 0 auto;
      padding: 24px 0;
    }

    .hero {
      background: #1e324a;
      color: #fff;
      border-radius: 19px;
      padding: 21px 24px;
      margin-bottom: 13px;
    }

    h1 {
      font-size: clamp(27px, 6vw, 35px);
      letter-spacing: -.8px;
      line-height: 1.15;
      margin: 0 0 9px;
      font-weight: 750;
    }

    .hero p {
      margin: 0;
      color: #d2dfeb;
      font-size: 16px;
    }

    .card {
      border: 1.5px solid #dce3e9;
      border-radius: 19px;
      background: #fff;
      padding: 20px 22px;
      margin-bottom: 13px;
      box-shadow: 0 2px 2px rgba(24,48,70,.015);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .09em;
      color: #316494;
      font-size: 11px;
      font-weight: 750;
      margin: 0 0 13px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field + .field {
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      min-height: 49px;
      border: 1.5px solid #dce3ea;
      border-radius: 11px;
      background: #f9fafb;
      color: #203249;
      padding: 0 14px;
      font: inherit;
      font-size: 17px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #316494;
      box-shadow: 0 0 0 3px rgba(49,100,148,.12);
    }

    input::placeholder {
      color: #9aa7b4;
    }

    select {
      cursor: pointer;
    }

    .hint {
      font-size: 12px;
      color: #768594;
      margin: 6px 0 0;
    }

    .result-card {
      padding-top: 19px;
      padding-bottom: 19px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .result-number {
      font-size: clamp(43px, 12vw, 61px);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -2px;
      color: #1e324a;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      margin: 0 0 6px;
      color: #647789;
      font-size: 17px;
    }

    .result-sub {
      border-top: 1px solid #e8edf1;
      margin: 14px 0 0;
      padding-top: 12px;
      color: #687a8b;
      font-size: 13px;
    }

    .note {
      color: #778694;
      font-size: 12px;
      line-height: 1.45;
      padding: 0 6px;
      margin: 0;
    }

    .note strong {
      color: #506174;
    }

    @media (max-width: 380px) {
      main {
        width: calc(100% - 24px);
        padding-top: 13px;
      }

      .hero, .card {
        border-radius: 17px;
      }

      .hero {
        padding: 18px 20px;
      }

      .card {
        padding: 17px 18px;
      }
    }

    @media (max-height: 700px) {
      main {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .hero {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .hero h1 {
        font-size: 26px;
        margin-bottom: 5px;
      }

      .hero p {
        font-size: 14px;
      }

      .card {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .eyebrow {
        margin-bottom: 10px;
      }

      .field + .field {
        margin-top: 11px;
      }

      .result-card {
        padding-top: 14px;
        padding-bottom: 14px;
      }
    }

    @media (min-width: 700px) and (min-height: 800px) {
      main {
        padding-top: 56px;
      }
    }
  </style>
</head>

<body>
  <main>

    <header class="hero">
      <h1>Blandingskalkulator</h1>
      <p>Bensin og totaktsolje</p>
    </header>

    <section class="card" aria-label="Beregn blanding">
      <p class="eyebrow">Beregn oljemengde</p>

      <div class="field">
        <label for="bensin">Bensin (liter)</label>
        <input
          id="bensin"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="F.eks. 10"
        >
        <p class="hint">Oppgi antall liter bensin.</p>
      </div>

      <div class="field">
        <label for="blanding">Blandingsforhold</label>
        <select id="blanding">
          <option value="50">1:50 · 2 %</option>
          <option value="40">1:40 · 2,5 %</option>
          <option value="33">1:33 · ca. 3 %</option>
          <option value="25">1:25 · 4 %</option>
        </select>
      </div>
    </section>

    <section class="card result-card"
             aria-live="polite"
             aria-atomic="true">

      <p class="eyebrow">Oljemengde</p>

      <div class="result-row">
        <output id="resultat" class="result-number">0,0</output>
        <p class="unit">desiliter</p>
      </div>

      <p class="result-sub" id="detalj">
        Tilsvarer 0 ml olje.
      </p>
    </section>

    <p class="note">
      <strong>Merk:</strong>
      Bruk blandingsforholdet som er anbefalt for din motor.
      Resultatet oppdateres automatisk.
    </p>

  </main>

  <script>
    const bensin = document.querySelector('#bensin');
    const blanding = document.querySelector('#blanding');
    const resultat = document.querySelector('#resultat');
    const detalj = document.querySelector('#detalj');

    const formatter = new Intl.NumberFormat('nb-NO', {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    });

    const mlFormatter = new Intl.NumberFormat('nb-NO', {
      maximumFractionDigits: 0
    });

    function beregn() {
      const raw = bensin.value.trim().replace(',', '.');
      const liter = raw === '' ? 0 : Number(raw);

      const gyldig = Number.isFinite(liter) && liter >= 0;

      bensin.setAttribute('aria-invalid', String(!gyldig));

      if (!gyldig) {
        resultat.textContent = '–';
        detalj.textContent = 'Oppgi et gyldig antall liter.';
        return;
      }

      const ml = liter * 1000 / Number(blanding.value);

      resultat.textContent = formatter.format(ml / 100);
      detalj.textContent =
        `Tilsvarer ${mlFormatter.format(ml)} ml olje.`;
    }

    bensin.addEventListener('input', beregn);
    blanding.addEventListener('change', beregn);

    beregn();
  </script>

</body>
</html>
